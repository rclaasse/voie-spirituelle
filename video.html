<script>
  const burger = document.querySelector(".burger");
  const nav = document.querySelector("nav");
  const overlay = document.querySelector(".overlay");

  burger.addEventListener("click", () => {
    burger.classList.toggle("active");
    nav.classList.toggle("active");
    overlay.classList.toggle("active");
  });

  overlay.addEventListener("click", () => {
    burger.classList.remove("active");
    nav.classList.remove("active");
    overlay.classList.remove("active");
  });
</script>

<script>
  const track = document.querySelector("#reels-track");
  const thumbnailStrip = document.querySelector("#video-strip");
  const thumbLeft = document.querySelector(".thumb-arrow-left");
  const thumbRight = document.querySelector(".thumb-arrow-right");

  let videos = [];
  let currentIndex = 0;
  let touchStartX = 0;

  function buildReels() {
    track.innerHTML = "";
    thumbnailStrip.innerHTML = "";

    videos.forEach((video, index) => {
      const article = document.createElement("article");
      article.className = "reel-card";

      article.innerHTML = `
        <blockquote
          class="instagram-media"
          data-instgrm-permalink="${video.url}"
          data-instgrm-version="14"
        ></blockquote>
      `;

      track.appendChild(article);

      const thumbnail = document.createElement("button");
      thumbnail.className =
        index === 0
          ? "video-thumbnail active"
          : "video-thumbnail";

      thumbnail.type = "button";
      thumbnail.dataset.index = index;
      thumbnail.setAttribute(
        "aria-label",
        `Apri il video ${index + 1}`
      );

      thumbnail.innerHTML = `
        <div class="thumbnail-placeholder">
          Video ${index + 1}
        </div>
      `;

      thumbnail.addEventListener("click", () => {
        showVideo(index);
      });

      thumbnailStrip.appendChild(thumbnail);
    });

    if (window.instgrm) {
      window.instgrm.Embeds.process();
    }
  }

function showVideo(index) {
  if (!videos.length) {
    return;
  }

  currentIndex =
    (index + videos.length) % videos.length;

  track.style.transform =
    `translateX(-${currentIndex * 100}%)`;

  document
    .querySelectorAll(".video-thumbnail")
    .forEach((thumbnail, thumbnailIndex) => {
      thumbnail.classList.toggle(
        "active",
        thumbnailIndex === currentIndex
      );
    });

  const dateElement =
    document.getElementById("video-date");

  const selectedVideo = videos[currentIndex];

  if (selectedVideo.date) {
    const date = new Date(selectedVideo.date);

    dateElement.textContent =
      "📅 " +
      date.toLocaleDateString("it-IT", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
  } else {
    dateElement.textContent = "";
  }
}

  async function loadVideos() {
    try {
      const response = await fetch(
        "videos.json",
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(
          `Errore HTTP: ${response.status}`
        );
      }

      videos = await response.json();

      if (!Array.isArray(videos) || videos.length === 0) {
        throw new Error(
          "Il file videos.json non contiene video."
        );
      }

      buildReels();
      showVideo(0);
    } catch (error) {
      console.error(error);

      track.innerHTML = `
        <p class="video-load-error">
          Impossibile caricare i video.
        </p>
      `;
    }
  }

  track.addEventListener(
    "touchstart",
    (event) => {
      touchStartX = event.touches[0].clientX;
    },
    { passive: true }
  );

  track.addEventListener("touchend", (event) => {
    const touchEndX =
      event.changedTouches[0].clientX;

    const difference =
      touchStartX - touchEndX;

    if (Math.abs(difference) < 50) {
      return;
    }

    showVideo(
      difference > 0
        ? currentIndex + 1
        : currentIndex - 1
    );
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") {
      showVideo(currentIndex + 1);
    }

    if (event.key === "ArrowLeft") {
      showVideo(currentIndex - 1);
    }
  });

  if (thumbLeft && thumbRight && thumbnailStrip) {
    thumbLeft.addEventListener("click", () => {
      thumbnailStrip.scrollBy({
        left: -220,
        behavior: "smooth"
      });
    });

    thumbRight.addEventListener("click", () => {
      thumbnailStrip.scrollBy({
        left: 220,
        behavior: "smooth"
      });
    });
  }

  loadVideos();
</script>

<script>
window.addEventListener("scroll", function () {
  const header = document.querySelector("header");

  if (window.scrollY > 80) {
    header.classList.add("shrink");
  } else {
    header.classList.remove("shrink");
  }
});
</script>
