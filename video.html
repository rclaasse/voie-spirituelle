<script>
  const burger = document.querySelector(".burger");
  const nav = document.querySelector("nav");
  const overlay = document.querySelector(".overlay");

  burger.addEventListener("click", () => {
    burger.classList.toggle("active");
    nav.classList.toggle("active");
    overlay.classList.toggle("active");
  });

  overlay.addEventListener("click", () => {
    burger.classList.remove("active");
    nav.classList.remove("active");
    overlay.classList.remove("active");
  });
</script>

<script>
  const track = document.querySelector(".reels-track");
  const cards = [...document.querySelectorAll(".reel-card")];
  const thumbnails = [...document.querySelectorAll(".video-thumbnail")];
  const thumbnailStrip = document.querySelector(".video-strip");
  const thumbLeft = document.querySelector(".thumb-arrow-left");
  const thumbRight = document.querySelector(".thumb-arrow-right");

  let currentIndex = 0;
  let touchStartX = 0;

  function showVideo(index) {
    currentIndex = (index + cards.length) % cards.length;

    track.style.transform =
      `translateX(-${currentIndex * 100}%)`;

    thumbnails.forEach((thumbnail, thumbnailIndex) => {
      thumbnail.classList.toggle(
        "active",
        thumbnailIndex === currentIndex
      );
    });
  }

  thumbnails.forEach((thumbnail) => {
    thumbnail.addEventListener("click", () => {
      showVideo(Number(thumbnail.dataset.index));
    });
  });

  track.addEventListener(
    "touchstart",
    (event) => {
      touchStartX = event.touches[0].clientX;
    },
    { passive: true }
  );

  track.addEventListener("touchend", (event) => {
    const touchEndX = event.changedTouches[0].clientX;
    const difference = touchStartX - touchEndX;

    if (Math.abs(difference) < 50) {
      return;
    }

    if (difference > 0) {
      showVideo(currentIndex + 1);
    } else {
      showVideo(currentIndex - 1);
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") {
      showVideo(currentIndex + 1);
    }

    if (event.key === "ArrowLeft") {
      showVideo(currentIndex - 1);
    }
  });
    if (thumbLeft && thumbRight && thumbnailStrip) {
    thumbLeft.addEventListener("click", () => {
        thumbnailStrip.scrollBy({
        left: -220,
        behavior: "smooth"
        });
    });

    thumbRight.addEventListener("click", () => {
        thumbnailStrip.scrollBy({
        left: 220,
        behavior: "smooth"
        });
    });
    }

  showVideo(0);
</script>

<script>
window.addEventListener("scroll", function () {
  const header = document.querySelector("header");

  if (window.scrollY > 80) {
    header.classList.add("shrink");
  } else {
    header.classList.remove("shrink");
  }
});
</script>
