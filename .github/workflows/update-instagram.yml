name: S-073 - video automatic

on:
  workflow_dispatch:

  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Instagram
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_instagram.py

      - name: Commit videos.json
        shell: bash
        run: |
          if git diff --quiet -- videos.json; then
            echo "No new Reel."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json
          git commit -m "Update Instagram Reels"
          git push